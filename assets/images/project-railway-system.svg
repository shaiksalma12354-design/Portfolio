<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d" />
      <stop offset="50%" stop-color="#141c2b" />
      <stop offset="100%" stop-color="#070d14" />
    </linearGradient>
    <linearGradient id="accentR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" rx="20" fill="url(#bgR)" />
  <rect width="796" height="446" x="2" y="2" rx="18" fill="none" stroke="url(#accentR)" stroke-width="2" opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#f59e0b" opacity="0.08" filter="url(#glowR)" />
  <circle cx="600" cy="240" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glowR)" />

  <!-- Left: C Console Terminal Mockup -->
  <g transform="translate(50, 45)">
    <rect width="400" height="360" rx="14" fill="#0d141f" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <!-- Terminal Header -->
    <rect width="400" height="38" rx="14" fill="#152030" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="34" cy="19" r="5" fill="#f59e0b" />
    <circle cx="48" cy="19" r="5" fill="#10b981" />
    <text x="70" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">railway_terminal.exe (C Core)</text>

    <!-- Terminal Text -->
    <g transform="translate(20, 55)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="18" fill="#38bdf8">==============================================</text>
      <text x="0" y="34" fill="#fbbf24">    INDIAN RAILWAYS RESERVATION SYSTEM (C)   </text>
      <text x="0" y="50" fill="#38bdf8">==============================================</text>

      <text x="0" y="75" fill="#e2e8f0">[1] Book Train Ticket (CRUD - Create)</text>
      <text x="0" y="95" fill="#e2e8f0">[2] Display All Bookings (CRUD - Read)</text>
      <text x="0" y="115" fill="#e2e8f0">[3] Modify Passenger Details (CRUD - Update)</text>
      <text x="0" y="135" fill="#e2e8f0">[4] Cancel Ticket &amp; Free Seat (CRUD - Delete)</text>
      <text x="0" y="155" fill="#e2e8f0">[5] Query PNR Status from Disk Storage</text>
      <text x="0" y="175" fill="#e2e8f0">[6] Exit System</text>

      <!-- Selection & Output Simulation -->
      <text x="0" y="205" fill="#34d399">&gt; Enter Choice [1-6]: 5</text>
      <text x="0" y="225" fill="#cbd5e1">&gt; Enter 10-Digit PNR Number: 8492041285</text>

      <!-- PNR Status Box -->
      <rect x="0" y="240" width="360" height="55" rx="6" fill="#19283d" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="260" fill="#38bdf8">PNR: 8492041285 | Train: 12727 Godavari Exp</text>
      <text x="12" y="280" fill="#34d399">Passenger: Salma Shaik | Status: CNF Coach B3-24</text>
    </g>
  </g>

  <!-- Right: Train & Low-Level C Tech Details -->
  <g transform="translate(480, 50)">
    <!-- Header -->
    <rect width="270" height="60" rx="12" fill="#182333" stroke="#f59e0b" stroke-width="1.2" />
    <text x="20" y="26" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">C Systems Programming</text>
    <text x="20" y="44" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Data Structures &amp; File I/O</text>

    <!-- Point 1: File Handling -->
    <g transform="translate(0, 80)">
      <rect width="270" height="54" rx="10" fill="#101824" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="24" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">Persistent File I/O</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">binary fopen, fwrite, fread, fseek persistence</text>
    </g>

    <!-- Point 2: Structs & Memory -->
    <g transform="translate(0, 148)">
      <rect width="270" height="54" rx="10" fill="#101824" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="24" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">Structs &amp; Dynamic Memory</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Zero external dependency memory management</text>
    </g>

    <!-- Point 3: Safe Parsing -->
    <g transform="translate(0, 216)">
      <rect width="270" height="54" rx="10" fill="#101824" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="24" fill="#34d399" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">Data Integrity &amp; Validation</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Input sanitization preventing record corruption</text>
    </g>
  </g>
</svg>
