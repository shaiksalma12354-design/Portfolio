<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131f" />
      <stop offset="50%" stop-color="#0f1d33" />
      <stop offset="100%" stop-color="#060c14" />
    </linearGradient>
    <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16253d" />
      <stop offset="100%" stop-color="#0d1829" />
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" rx="20" fill="url(#bgH)" />
  <rect width="796" height="446" x="2" y="2" rx="18" fill="none" stroke="url(#accentH)" stroke-width="2" opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="140" fill="#0ea5e9" opacity="0.12" filter="url(#glowH)" />
  <circle cx="650" cy="300" r="160" fill="#10b981" opacity="0.1" filter="url(#glowH)" />

  <!-- Left: Healthcare Interface / Chat Mockup -->
  <g transform="translate(60, 50)">
    <!-- Main Device / Chat Window -->
    <rect width="360" height="350" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

    <!-- Chat Header -->
    <rect width="360" height="60" rx="16" fill="#0f1d33" />
    <circle cx="36" cy="30" r="16" fill="#0ea5e9" />
    <path d="M36 20 L36 40 M26 30 L46 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text x="64" y="27" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">AI Health Assistant</text>
    <text x="64" y="44" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">● Online | WHO Verified Data</text>

    <!-- Chat Bubbles -->
    <!-- Bot Message 1 -->
    <rect x="20" y="80" width="260" height="52" rx="12" fill="#1e293b" />
    <text x="32" y="102" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Hello! How can I assist with your</text>
    <text x="32" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">health or vaccination queries today?</text>

    <!-- User Message -->
    <rect x="110" y="145" width="230" height="42" rx="12" fill="#0284c7" />
    <text x="122" y="171" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">What are the early Dengue symptoms?</text>

    <!-- Bot Response 2 with NLP Analysis -->
    <rect x="20" y="200" width="310" height="85" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="32" y="222" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">[WHO Diagnostics Intent Recognized]</text>
    <text x="32" y="242" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">High fever, severe headache, joint pain,</text>
    <text x="32" y="260" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">and fatigue. Stay hydrated & consult clinic.</text>
    <text x="32" y="276" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Available in Hindi, Telugu, English (WhatsApp/SMS)</text>

    <!-- Input Bar -->
    <rect x="20" y="300" width="320" height="36" rx="18" fill="#090f19" stroke="rgba(255,255,255,0.1)" />
    <text x="36" y="323" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Type your health query in any language...</text>
    <circle cx="318" cy="318" r="12" fill="#0ea5e9" />
    <path d="M314 318 L322 318 M318 314 L322 318 L318 322" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right: Architecture & Tech Badges -->
  <g transform="translate(460, 60)">
    <!-- SIH 2025 Trophy Card -->
    <rect width="280" height="74" rx="14" fill="#1c2518" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="37" r="20" fill="rgba(16,185,129,0.2)" />
    <path d="M28 32 L36 42 L46 26" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="70" y="32" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">SIH 2025 Internal Winner</text>
    <text x="70" y="52" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Smart India Hackathon Qualifier</text>

    <!-- Tech Nodes Grid -->
    <!-- Node 1: Dialogflow -->
    <g transform="translate(0, 95)">
      <rect width="280" height="52" rx="10" fill="#121d30" stroke="rgba(56,189,248,0.2)" />
      <text x="20" y="26" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Google Dialogflow</text>
      <text x="20" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">NLP Intent &amp; Entity Classification</text>
      <circle cx="250" cy="26" r="10" fill="#0ea5e9" opacity="0.2" />
      <text x="250" y="30" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">AI</text>
    </g>

    <!-- Node 2: Multilingual Translation -->
    <g transform="translate(0, 160)">
      <rect width="280" height="52" rx="10" fill="#121d30" stroke="rgba(168,85,247,0.2)" />
      <text x="20" y="26" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">MyMemory Translation API</text>
      <text x="20" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Multi-language dialect conversion</text>
      <circle cx="250" cy="26" r="10" fill="#c084fc" opacity="0.2" />
      <text x="250" y="30" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle">API</text>
    </g>

    <!-- Node 3: Data Scraper -->
    <g transform="translate(0, 225)">
      <rect width="280" height="52" rx="10" fill="#121d30" stroke="rgba(16,185,129,0.2)" />
      <text x="20" y="26" fill="#34d399" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">BeautifulSoup Web Scraper</text>
      <text x="20" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Real-time medical advisories from WHO</text>
      <circle cx="250" cy="26" r="10" fill="#34d399" opacity="0.2" />
      <text x="250" y="30" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">ETL</text>
    </g>

    <!-- Node 4: Backend & Hosting -->
    <g transform="translate(0, 290)">
      <rect width="280" height="52" rx="10" fill="#121d30" stroke="rgba(245,158,11,0.2)" />
      <text x="20" y="26" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Flask + Render Deployment</text>
      <text x="20" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">WhatsApp &amp; SMS gateway endpoints</text>
      <circle cx="250" cy="26" r="10" fill="#fbbf24" opacity="0.2" />
      <text x="250" y="30" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">WEB</text>
    </g>
  </g>
</svg>
