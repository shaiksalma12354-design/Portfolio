<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c68662" />
      <stop offset="100%" stop-color="#a86846" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="34" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />

  <!-- Ambient Tech Grid / Neural Nodes -->
  <g opacity="0.25">
    <circle cx="80" cy="80" r="3" fill="#38bdf8" />
    <circle cx="320" cy="70" r="3" fill="#c084fc" />
    <circle cx="60" cy="240" r="3" fill="#818cf8" />
    <circle cx="340" cy="220" r="3" fill="#38bdf8" />
    <path d="M80 80 L140 120 M320 70 L260 110 M60 240 L110 260 M340 220 L290 250" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Glowing Circular Backdrop Aura -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#neonGlow)" opacity="0.75" />
  <circle cx="200" cy="180" r="105" fill="#172033" opacity="0.8" />

  <!-- Avatar Character (Female Tech Engineer Illustration) -->
  <g id="avatarFigure">
    <!-- Shoulders & Hoodie -->
    <path d="M120 330 C120 270, 150 250, 200 250 C250 250, 280 270, 280 330 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie trim & neckline -->
    <path d="M165 255 L200 295 L235 255" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M175 252 C185 268, 215 268, 225 252" fill="none" stroke="#6366f1" stroke-width="2" />

    <!-- Neck -->
    <rect x="186" y="215" width="28" height="42" rx="6" fill="url(#skinGrad)" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="175" rx="46" ry="54" fill="url(#skinGrad)" />

    <!-- Hair (Back/Drape) -->
    <path d="M150 170 C140 225, 145 280, 160 300 C152 250, 158 190, 160 160 Z" fill="url(#hairGrad)" />
    <path d="M250 170 C260 225, 255 280, 240 300 C248 250, 242 190, 240 160 Z" fill="url(#hairGrad)" />

    <!-- Hair (Front/Bangs) -->
    <path d="M150 160 C150 120, 170 110, 200 110 C230 110, 250 120, 250 160 C240 140, 225 135, 200 135 C175 135, 160 140, 150 160 Z" fill="url(#hairGrad)" />
    <path d="M152 155 C165 140, 185 138, 205 148 C195 135, 170 132, 152 155 Z" fill="#2d3748" opacity="0.6" />

    <!-- Eyes (Focused, friendly) -->
    <ellipse cx="184" cy="175" rx="5" ry="3.5" fill="#0f172a" />
    <ellipse cx="216" cy="175" rx="5" ry="3.5" fill="#0f172a" />
    <circle cx="186" cy="173" r="1.5" fill="#ffffff" />
    <circle cx="218" cy="173" r="1.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M176 166 Q185 162 193 166" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />
    <path d="M207 166 Q215 162 224 166" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />

    <!-- Gentle Smile -->
    <path d="M192 198 Q200 206 208 198" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" />

    <!-- Tech Glasses / AR Frames -->
    <rect x="170" y="165" width="26" height="18" rx="6" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="204" y="165" width="26" height="18" rx="6" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M196 173 L204 173" stroke="#38bdf8" stroke-width="2" />
    <path d="M170 173 L158 170" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M230 173 L242 170" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="172" y="167" width="22" height="6" fill="#38bdf8" opacity="0.2" />
    <rect x="206" y="167" width="22" height="6" fill="#38bdf8" opacity="0.2" />
  </g>

  <!-- Tech Floating Badges around Avatar -->
  <!-- AI / Brain Chip Badge -->
  <g transform="translate(60, 150)">
    <rect width="64" height="28" rx="8" fill="#111827" stroke="#818cf8" stroke-width="1.5" />
    <text x="32" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">AI / ML</text>
  </g>

  <!-- Python Badge -->
  <g transform="translate(280, 130)">
    <rect width="60" height="28" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <text x="30" y="18" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;code&gt;</text>
  </g>

  <!-- Bottom Floating Name Card -->
  <g transform="translate(90, 325)">
    <rect width="220" height="42" rx="12" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5" filter="url(#neonGlow)" opacity="0.95" />
    <text x="110" y="22" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Shaik Banaganapalli Salma</text>
    <text x="110" y="35" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">AI &amp; Machine Learning Engineer</text>
  </g>
</svg>
