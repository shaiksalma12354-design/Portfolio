<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d1c" />
      <stop offset="50%" stop-color="#16122e" />
      <stop offset="100%" stop-color="#090a14" />
    </linearGradient>
    <linearGradient id="accentA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="editorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141526" />
      <stop offset="100%" stop-color="#0d0e1c" />
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" rx="20" fill="url(#bgA)" />
  <rect width="796" height="446" x="2" y="2" rx="18" fill="none" stroke="url(#accentA)" stroke-width="2" opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="250" cy="180" r="140" fill="#8b5cf6" opacity="0.12" filter="url(#glowA)" />
  <circle cx="650" cy="220" r="150" fill="#ec4899" opacity="0.1" filter="url(#glowA)" />

  <!-- Left: Code Editor Terminal with Error Highlight -->
  <g transform="translate(50, 45)">
    <rect width="360" height="360" rx="14" fill="url(#editorBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <!-- Window Bar -->
    <rect width="360" height="38" rx="14" fill="#1b1c33" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="34" cy="19" r="5" fill="#f59e0b" />
    <circle cx="48" cy="19" r="5" fill="#10b981" />
    <text x="70" y="23" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">snippet.py (Input Code)</text>

    <!-- Code Content -->
    <g transform="translate(18, 55)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="20" fill="#64748b">1</text>
      <text x="25" y="20" fill="#f43f5e">def</text>
      <text x="55" y="20" fill="#818cf8">calculate_average</text>
      <text x="180" y="20" fill="#cbd5e1">(scores):</text>

      <text x="0" y="42" fill="#64748b">2</text>
      <text x="40" y="42" fill="#cbd5e1">total = sum(scores)</text>

      <!-- Error line highlighted in red box -->
      <rect x="20" y="48" width="310" height="24" rx="4" fill="rgba(239,68,68,0.18)" stroke="#ef4444" stroke-width="1" />
      <text x="0" y="65" fill="#ef4444" font-weight="bold">3</text>
      <text x="40" y="65" fill="#fca5a5">return total / len(score)</text>
      <text x="220" y="65" fill="#ef4444"># ❌ NameError</text>

      <text x="0" y="88" fill="#64748b">4</text>
      <text x="25" y="88" fill="#f43f5e">print</text>
      <text x="65" y="88" fill="#cbd5e1">(calculate_average([95, 88]))</text>
    </g>

    <!-- Error Banner Below Code -->
    <rect x="18" y="165" width="324" height="42" rx="8" fill="#2d141e" stroke="#ef4444" stroke-width="1" />
    <text x="32" y="185" fill="#fca5a5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">NameError: name 'score' is not defined</text>
    <text x="32" y="198" fill="#fda4af" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Did you mean: 'scores'? (Line 3)</text>

    <!-- ALORA AI Fix Preview Box -->
    <rect x="18" y="225" width="324" height="110" rx="8" fill="#14261d" stroke="#10b981" stroke-width="1" />
    <text x="32" y="248" fill="#34d399" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">✨ ALORA Suggested Fix:</text>
    <rect x="30" y="258" width="298" height="26" rx="4" fill="rgba(16,185,129,0.15)" />
    <text x="40" y="275" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11">+ return total / len(scores)</text>
    <text x="32" y="305" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Tip: In Python, variables are case-sensitive and</text>
    <text x="32" y="320" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">must match function parameter definitions.</text>
  </g>

  <!-- Right: ALORA Features & Multi-Language Support -->
  <g transform="translate(450, 50)">
    <!-- Hackathon Header Card -->
    <rect width="300" height="65" rx="12" fill="#231938" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="34" cy="32" r="18" fill="rgba(139,92,246,0.25)" />
    <text x="34" y="38" fill="#c084fc" font-size="18" text-anchor="middle">⚡</text>
    <text x="64" y="28" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">CodeEdge Hackathon</text>
    <text x="64" y="46" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Smart Debugging Assistant</text>

    <!-- Multi-Language Support Pills -->
    <g transform="translate(0, 80)">
      <rect width="90" height="32" rx="8" fill="#1c1936" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="21" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Python</text>

      <rect x="105" width="90" height="32" rx="8" fill="#1c1936" stroke="#f89820" stroke-width="1" />
      <text x="150" y="21" fill="#f89820" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Java</text>

      <rect x="210" width="90" height="32" rx="8" fill="#1c1936" stroke="#93c5fd" stroke-width="1" />
      <text x="255" y="21" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">C Lang</text>
    </g>

    <!-- Feature 1: Root Cause Analysis -->
    <g transform="translate(0, 130)">
      <rect width="300" height="58" rx="10" fill="#15172c" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="25" fill="#f472b6" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Root-Cause Analysis Engine</text>
      <text x="18" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Explains "WHY" the error occurred in plain words</text>
    </g>

    <!-- Feature 2: AST & NLP Parsing -->
    <g transform="translate(0, 202)">
      <rect width="300" height="58" rx="10" fill="#15172c" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="25" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Automated Diff Generator</text>
      <text x="18" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Side-by-side corrected code snippet with tips</text>
    </g>

    <!-- Feature 3: Interactive Sandbox -->
    <g transform="translate(0, 274)">
      <rect width="300" height="58" rx="10" fill="#15172c" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="25" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Real-Time Validation Sandbox</text>
      <text x="18" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Executes dynamic inputs against target testcases</text>
    </g>
  </g>
</svg>
