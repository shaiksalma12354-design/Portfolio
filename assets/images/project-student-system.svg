<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1727" />
      <stop offset="50%" stop-color="#111f38" />
      <stop offset="100%" stop-color="#080f1a" />
    </linearGradient>
    <linearGradient id="accentS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="tableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15243b" />
      <stop offset="100%" stop-color="#0f1929" />
    </linearGradient>
    <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" rx="20" fill="url(#bgS)" />
  <rect width="796" height="446" x="2" y="2" rx="18" fill="none" stroke="url(#accentS)" stroke-width="2" opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="220" r="140" fill="#38bdf8" opacity="0.1" filter="url(#glowS)" />
  <circle cx="650" cy="200" r="150" fill="#6366f1" opacity="0.1" filter="url(#glowS)" />

  <!-- Left: Dashboard Interface Mockup -->
  <g transform="translate(50, 45)">
    <rect width="420" height="360" rx="14" fill="url(#tableBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <!-- Top Bar -->
    <rect width="420" height="45" rx="14" fill="#0c1729" />
    <circle cx="25" cy="22" r="5" fill="#ef4444" />
    <circle cx="39" cy="22" r="5" fill="#f59e0b" />
    <circle cx="53" cy="22" r="5" fill="#10b981" />
    <text x="80" y="27" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Student Management Portal (Flask + SQL)</text>

    <!-- Mini KPI Stat Cards -->
    <g transform="translate(18, 60)">
      <rect width="118" height="52" rx="8" fill="#1b2a45" />
      <text x="12" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">TOTAL ENROLLED</text>
      <text x="12" y="44" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">1,248 Students</text>

      <rect x="132" width="118" height="52" rx="8" fill="#1b2a45" />
      <text x="144" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">DEPARTMENTS</text>
      <text x="144" y="44" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">6 Active</text>

      <rect x="264" width="120" height="52" rx="8" fill="#1b2a45" />
      <text x="276" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">DATABASE</text>
      <text x="276" y="44" fill="#34d399" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">Connected</text>
    </g>

    <!-- Table Header -->
    <g transform="translate(18, 130)">
      <rect width="384" height="32" rx="6" fill="#111c30" />
      <text x="12" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ID</text>
      <text x="50" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">NAME</text>
      <text x="160" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">BRANCH</text>
      <text x="250" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">CGPA</text>
      <text x="320" y="21" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ACTION</text>

      <!-- Row 1 -->
      <g transform="translate(0, 38)">
        <rect width="384" height="36" rx="4" fill="#162238" />
        <text x="12" y="22" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">#101</text>
        <text x="50" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Salma Shaik</text>
        <text x="160" y="22" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">AI &amp; ML</text>
        <text x="250" y="22" fill="#34d399" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">8.91</text>
        <rect x="315" y="8" width="55" height="20" rx="4" fill="#0284c7" />
        <text x="342" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">EDIT</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 80)">
        <rect width="384" height="36" rx="4" fill="#131e33" />
        <text x="12" y="22" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">#102</text>
        <text x="50" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Rahul Verma</text>
        <text x="160" y="22" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">CSE</text>
        <text x="250" y="22" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">8.65</text>
        <rect x="315" y="8" width="55" height="20" rx="4" fill="#0284c7" />
        <text x="342" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">EDIT</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 122)">
        <rect width="384" height="36" rx="4" fill="#162238" />
        <text x="12" y="22" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">#103</text>
        <text x="50" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Ananya Sen</text>
        <text x="160" y="22" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">ECE</text>
        <text x="250" y="22" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold">8.42</text>
        <rect x="315" y="8" width="55" height="20" rx="4" fill="#0284c7" />
        <text x="342" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">EDIT</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 168)">
        <rect width="140" height="28" rx="6" fill="#10b981" />
        <text x="70" y="18" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Add New Student</text>
      </g>
    </g>
  </g>

  <!-- Right: Architecture & Tech Badges -->
  <g transform="translate(500, 50)">
    <rect width="250" height="60" rx="12" fill="#16233b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="20" y="26" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">Full-Stack Flask App</text>
    <text x="20" y="44" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Complete CRUD Architecture</text>

    <!-- Point 1 -->
    <g transform="translate(0, 80)">
      <rect width="250" height="54" rx="10" fill="#101929" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="24" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">SQL Database Schema</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Normalized relational student tables</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 148)">
      <rect width="250" height="54" rx="10" fill="#101929" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="24" fill="#818cf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">Secure Form Handling</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Input sanitization and validation</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 216)">
      <rect width="250" height="54" rx="10" fill="#101929" stroke="rgba(255,255,255,0.06)" />
      <text x="18" y="24" fill="#34d399" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">Responsive Templates</text>
      <text x="18" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">HTML5/CSS3 Jinja2 user interface</text>
    </g>
  </g>
</svg>
